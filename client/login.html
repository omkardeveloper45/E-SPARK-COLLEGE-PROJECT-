<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – E-SPARK EV System</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="brand-logo">
        <div class="brand-icon">⚡</div>
        <div>
          <div class="brand-text">E-SPARK <span>EV</span></div>
          <span class="brand-subtext">EV CHARGING STATION</span>
        </div>
      </a>
      <ul class="nav-menu">
        <li><a href="/" class="nav-link">Home</a></li>
        <li><a href="/booking" class="nav-link">Find Station</a></li>
        <li><a href="/support" class="nav-link">Support</a></li>
      </ul>
      <div class="nav-auth"></div>
    </div>
  </nav>

  <div class="page-container">
    <div class="auth-wrapper">
      <div class="auth-header">
        <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">⚡</div>
        <h1>Welcome Back</h1>
        <p>Login to your E-SPARK account to charge and pay</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="rahul@espark.com" required />
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
            <label for="loginPassword" style="margin: 0;">Password</label>
            <a href="#" onclick="showToast('Password reset link sent to email', 'success')" style="font-size: 0.8rem; color: #059669; font-weight: 600;">Forgot Password?</a>
          </div>
          <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required />
        </div>

        <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem;">
          <input type="checkbox" id="rememberMe" checked style="accent-color: #059669;" />
          <label for="rememberMe" style="margin: 0; font-weight: 500; font-size: 0.85rem; color: #475569;">Remember me on this device</label>
        </div>

        <button type="submit" class="btn-primary btn-block" style="margin-top: 1.5rem; padding: 0.8rem;">
          Login to E-SPARK
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: #64748B;">
        Don't have an account? <a href="/register" style="color: #059669; font-weight: 700;">Create Account</a>
      </div>

      <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid #E2E8F0; text-align: center;">
        <a href="/admin" style="font-size: 0.85rem; color: #475569; font-weight: 600;">🛡️ Switch to Admin Portal Login</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
